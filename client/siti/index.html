  <body data-landing="siti">
    <script>
      // Applica il tema salvato prima del render (chiaro di default) per
      // evitare il flash. Il chiaro si fonde col video bianco, lo scuro col
      // video dark.
      (function () {
        try {
          if (localStorage.getItem("theme") === "dark")
            document.documentElement.classList.add("dark");
        } catch (e) {
          /* localStorage non disponibile: resta chiaro */
        }
      })();
    </script>
